name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Rapid pushes during active iteration used to trigger one CI run per
# commit, flooding the inbox with failure emails for the same defect.
# cancel-in-progress collapses bursts to one run per branch tip — the
# latest push wins; older queued/running jobs are cancelled, and cancelled
# runs don't generate failure emails.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      # Don't short-circuit on the first failure — an OS-specific failure
      # (Windows-only regression vs a real cross-platform bug) is exactly
      # the information the matrix exists to produce.
      fail-fast: false
      matrix:
        # Tusk's Vault ships to Windows users in practice (run.bat,
        # setup.bat, uninstall.ps1, win32 branches in keys/store.ts).
        # Without windows-latest, Windows-only regressions reach users
        # undetected. ubuntu-latest carries the Linux-only audit steps.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The audit scripts read `git ls-files` and HEAD only — a shallow
          # checkout is sufficient, and the identity layer's --all walk sees
          # exactly the fetched refs.
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Runs on BOTH matrix legs, unlike the audits below, because it is the
      # only step that starts the application. Every unit test can pass while
      # the server fails at import — that is not hypothetical: a transitive
      # native dependency with no binary for the host arch took the whole boot
      # down while the suite stayed green. This catches that class on each OS
      # we claim to run on, and it is the closest thing in CI to "a stranger
      # cloned it and double-clicked run.bat".
      - name: Boot check (server actually starts)
        run: npm run boot-check

      # Linux-only below: the audit scripts run once per build — no benefit
      # to repeating them on Windows.
      #
      # Gitleaks is intentionally NOT installed here. The in-tree scanners
      # cover the same threat shapes (token regexes, filename heuristics,
      # personal identifiers) and are unit-tested; audit-current-tree.mjs
      # uses gitleaks as an extra layer when the binary is present and
      # continues with a note when it is not. No third-party tarball to
      # SHA-pin, no fail-closed placeholder blocking downstream steps.
      - name: Audit current tree (dev mode)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/audit-current-tree.mjs --dev-mode
      - name: Audit security contracts
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/audit-security-contracts.mjs
      # Scoped to dependencies that actually SHIP (--omit=dev) at high
      # severity. An unscoped moderate-level gate fails on advisories
      # against build-only packages that never reach an install, and turns
      # a green build red overnight on a commit that changed nothing —
      # which trains everyone to ignore a red CI. Dev-dependency advisories
      # still surface via Dependabot; they just don't gate the build.
      # Same scan, with named exceptions. The raw command was failing on two
      # advisories that have no fixed release inside the range their parent
      # allows, and the only ways to get it green — lowering the level or
      # appending `|| true` — disarm the gate for every future advisory too.
      # scripts/audit-dependencies.mjs keeps the scan and requires each
      # exception to carry a reason and a review date.
      - name: npm audit (shipping deps, high+, with named exceptions)
        if: matrix.os == 'ubuntu-latest'
        run: npm run audit:deps
